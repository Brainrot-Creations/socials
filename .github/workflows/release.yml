name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: >
      github.actor != 'github-actions[bot]' &&
      (contains(github.event.head_commit.message, '[release:patch]') ||
       contains(github.event.head_commit.message, '[release:minor]') ||
       contains(github.event.head_commit.message, '[release:major]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest (re-run safety)
        run: git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Determine bump type and next version
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$COMMIT_MSG" | grep -q '\[release:major\]'; then TYPE=major
          elif echo "$COMMIT_MSG" | grep -q '\[release:minor\]'; then TYPE=minor
          else TYPE=patch; fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT

          CURRENT=$(jq -r .version package.json)
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          case $TYPE in
            major) NEXT="$((MAJ+1)).0.0" ;;
            minor) NEXT="$MAJ.$((MIN+1)).0" ;;
            patch) NEXT="$MAJ.$MIN.$((PAT+1))" ;;
          esac
          echo "next_version=$NEXT" >> $GITHUB_OUTPUT

          if git ls-remote --tags origin "refs/tags/v$NEXT" | grep -q "v$NEXT"; then
            echo "already_tagged=true" >> $GITHUB_OUTPUT
          else
            echo "already_tagged=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Version bump + build + tag + push
        if: steps.bump.outputs.already_tagged == 'false'
        run: node scripts/release.mjs ${{ steps.bump.outputs.type }} --skip-publish --skip-git-check

      - name: Build (re-run — tag already exists)
        if: steps.bump.outputs.already_tagged == 'true'
        run: npm run build

      - name: Ensure release version is synced
        run: |
          EXPECTED="${{ steps.bump.outputs.next_version }}"
          CURRENT="$(jq -r .version package.json)"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "Version mismatch detected (current=$CURRENT expected=$EXPECTED). Syncing package manifests..."
            jq --arg v "$EXPECTED" '.version = $v' package.json > package.tmp.json && mv package.tmp.json package.json
            jq --arg v "$EXPECTED" '.version = $v | .dependencies["@brainrotcreations/socials"] = $v' packages/unscoped/package.json > packages/unscoped/package.tmp.json && mv packages/unscoped/package.tmp.json packages/unscoped/package.json
          fi
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Resolve publish version (auto-jump on conflicts)
        id: resolve
        run: |
          bump_patch() {
            local v="$1"
            IFS='.' read -r MAJ MIN PAT <<< "$v"
            echo "${MAJ}.${MIN}.$((PAT+1))"
          }

          VERSION="$(jq -r .version package.json)"
          while npm view "@brainrotcreations/socials@$VERSION" version >/dev/null 2>&1; do
            echo "@brainrotcreations/socials@$VERSION already exists on npm. Jumping patch..."
            VERSION="$(bump_patch "$VERSION")"
          done

          CURRENT="$(jq -r .version package.json)"
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "Updating manifests to resolved version: $VERSION"
            jq --arg v "$VERSION" '.version = $v' package.json > package.tmp.json && mv package.tmp.json package.json
            jq --arg v "$VERSION" '.version = $v | .dependencies["@brainrotcreations/socials"] = $v' packages/unscoped/package.json > packages/unscoped/package.tmp.json && mv packages/unscoped/package.tmp.json packages/unscoped/package.json

            git add package.json packages/unscoped/package.json
            if [ -n "$(git diff --cached --name-only)" ]; then
              git commit -m "chore: release v$VERSION"
              git push origin main
            fi
          fi

          if ! git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
            if [ -z "$(git tag -l "v$VERSION")" ]; then
              git tag "v$VERSION" -m "Release v$VERSION"
            fi
            git push origin "v$VERSION"
          fi

          echo "resolved_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: |
          VERSION="${{ steps.resolve.outputs.resolved_version }}"
          NPM_TAG="latest"
          if echo "$VERSION" | grep -q '-'; then NPM_TAG="next"; fi

          echo "Publishing @brainrotcreations/socials@$VERSION → npm tag: $NPM_TAG"
          npm publish --access public --tag $NPM_TAG

          echo "Waiting for registry propagation..."
          sleep 15

          cd packages/unscoped
          # Pin dependency to exact published version
          jq --arg v "$VERSION" '.version = $v | .dependencies["@brainrotcreations/socials"] = $v' package.json > package.tmp.json && mv package.tmp.json package.json
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm install

          echo "Publishing socials@$VERSION → npm tag: $NPM_TAG"
          npm publish --access public --tag $NPM_TAG

          cd ../..
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          TAG="v${{ steps.resolve.outputs.resolved_version }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}~1" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "$PREV_TAG..$TAG" --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES="Initial release"
          fi
          PRERELEASE=""
          if echo "$TAG" | grep -q '\-'; then PRERELEASE="--prerelease"; fi
          gh release create "$TAG" --title "$TAG" $PRERELEASE --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
